# deploy/go-learn-service.yaml
apiVersion: v1
kind: Service
metadata:
  name: go-learn-service
  namespace: default
spec:
  selector:
    app: go-learn # ✅ Match Deployment label
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: ClusterIP # or LoadBalancer if external access is needed
