# deploy/go-core-service.yaml
apiVersion: v1
kind: Service
metadata:
  name: go-core-service
  namespace: default
spec:
  selector:
    app: go-core # ✅ Match Deployment label
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: ClusterIP # or LoadBalancer if external access is needed
