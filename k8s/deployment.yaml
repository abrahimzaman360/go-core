apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-core
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-core
  template:
    metadata:
      labels:
        app: go-core
    spec:
      containers:
        - name: go-core
          image: ghcr.io/abrahimzaman360/go-core:BUILD_NUMBER
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          imagePullSecrets:
            - name: ghcr-secret
