apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-learn
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-learn
  template:
    metadata:
      labels:
        app: go-learn
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: go-learn
          image: ghcr.io/abrahimzaman360/go-learn:latest
          ports:
            - containerPort: 3000
